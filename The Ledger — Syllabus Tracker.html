<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Ledger — Syllabus Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#EDEAE0; --paper-soft:#F7F5EE; --paper-line:#D9D4C4;
  --ink:#152A3B; --ink-soft:#8B8676; --amber:#B08A3E; --teal:#1F6F5C; --on-accent:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101C27; --paper-soft:#182734; --paper-line:#2A3B4A;
    --ink:#EDEAE0; --ink-soft:#9A9787; --amber:#D4AE5F; --teal:#3FA58C; --on-accent:#0E1A24;
  }
}
:root[data-theme="dark"]{
  --paper:#101C27; --paper-soft:#182734; --paper-line:#2A3B4A;
  --ink:#EDEAE0; --ink-soft:#9A9787; --amber:#D4AE5F; --teal:#3FA58C; --on-accent:#0E1A24;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{max-width:920px;margin:0 auto;padding:32px 18px 90px;}
header.masthead{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
.mark{font-size:11px;letter-spacing:.06em;color:var(--ink-soft);font-weight:600;}
h1.title{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(28px,5vw,40px);margin:4px 0 0;line-height:1.05;}
.msub{font-size:13px;color:var(--ink-soft);max-width:340px;text-align:right;line-height:1.5;}
.controls{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:210px;}
.field label{font-size:12px;color:var(--ink-soft);font-weight:600;}
select,input.q{font:inherit;font-size:15px;padding:10px 12px;border-radius:8px;border:1px solid var(--paper-line);background:var(--paper-soft);color:var(--ink);width:100%;}
input.q:focus,select:focus,.chip:focus-visible,.row-main:focus-visible,.cb:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
.cover{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;line-height:1.55;}
.cover b{color:var(--ink);}
.strip{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;align-items:center;}
.chip{border:1px solid var(--paper-line);background:var(--paper-soft);color:var(--ink-soft);font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;min-width:38px;height:38px;padding:0 10px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.chip:hover{border-color:var(--ink-soft);}
.chip.active{background:var(--ink);color:var(--paper-soft);border-color:var(--ink);}
.chip.done{color:var(--teal);border-color:var(--teal);}
.chip.active.done{background:var(--teal);border-color:var(--teal);color:var(--on-accent);}
.chip.txt{font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;}
.sep{width:1px;height:24px;background:var(--paper-line);margin:0 4px;}
.gtitle{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:24px 0 4px;}
.ledger{border-top:2px solid var(--ink);}
.subj{border-bottom:1px solid var(--paper-line);}
.subj.done{background:var(--paper-soft);}
.row{display:grid;grid-template-columns:34px 92px 1fr 56px 44px 24px;gap:10px;align-items:center;padding:12px 4px;}
.cb{width:22px;height:22px;border:1.5px solid var(--ink-soft);border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--paper-soft);flex:0 0 22px;padding:0;}
.cb svg{width:14px;height:14px;opacity:0;}
.cb.on{background:var(--teal);border-color:var(--teal);}
.cb.on svg{opacity:1;}
.cb.part{border-color:var(--teal);}
.cb.part::after{content:"";width:10px;height:2px;background:var(--teal);}
.scode{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);font-weight:600;}
.row-main{cursor:pointer;background:none;border:0;text-align:left;font:inherit;color:inherit;padding:0;min-width:0;}
.sname{font-size:14.5px;line-height:1.3;display:block;}
.subj.done .sname{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--paper-line);}
.mini{display:flex;align-items:center;gap:8px;margin-top:6px;}
.mini .bar{flex:1;max-width:220px;margin:0;height:4px;}
.mini span{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);}
.nod{font-size:11.5px;color:var(--ink-soft);margin-top:4px;display:block;}
.sltp{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);text-align:center;}
.scred{font-family:'JetBrains Mono',monospace;font-size:13px;text-align:right;font-weight:600;}
.chev{color:var(--ink-soft);font-size:13px;text-align:center;transition:transform .15s;}
.subj.open .chev{transform:rotate(90deg);}
.sem-tag{font-size:11px;color:var(--ink-soft);margin-left:4px;}
.panel{padding:4px 6px 22px 44px;}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;margin:4px 0 16px;}
.meta div{font-size:13px;line-height:1.4;}
.meta i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:2px;}
.sec{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin:18px 0 6px;}
.panel p{font-size:13.5px;line-height:1.6;margin:0 0 6px;max-width:70ch;}
ol.list{margin:0;padding-left:20px;font-size:13.5px;line-height:1.6;max-width:72ch;}
ol.list li{margin-bottom:3px;}
.unit{border:1px solid var(--paper-line);border-radius:10px;background:var(--paper-soft);margin-bottom:10px;}
.uh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--paper-line);}
.uh .ut{flex:1;font-size:14px;font-weight:600;line-height:1.3;}
.uh .ul{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);font-weight:700;}
.uh .uc{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
.topics{padding:6px 12px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 16px;}
.topic{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13px;line-height:1.4;cursor:pointer;}
.topic .cb{width:18px;height:18px;flex:0 0 18px;margin-top:1px;border-radius:4px;}
.topic .cb svg{width:11px;height:11px;}
.topic.on span{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--paper-line);}
.subtotal{display:flex;justify-content:space-between;align-items:center;padding:16px 4px 6px;border-top:2px solid var(--ink);margin-top:2px;}
.subtotal .label{font-size:13px;color:var(--ink-soft);}
.subtotal .value{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;}
.bar{height:6px;border-radius:4px;background:var(--paper-line);overflow:hidden;margin-top:8px;}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:4px;transition:width .25s;}
.overall{margin-top:32px;padding-top:20px;border-top:1px solid var(--paper-line);display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.stat{background:var(--paper-soft);border:1px solid var(--paper-line);border-radius:10px;padding:14px 16px;}
.stat .n{font-family:'Fraunces',serif;font-size:24px;font-weight:600;}
.stat .l{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.empty{padding:22px 4px;color:var(--ink-soft);font-size:13.5px;}
.foot{font-size:12px;color:var(--ink-soft);margin-top:26px;line-height:1.6;display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.link{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--teal);cursor:pointer;}
@media (max-width:620px){
  .row{grid-template-columns:30px 1fr 40px 20px;}
  .col-code,.col-ltp{display:none;}
  .panel{padding-left:6px;}
  header.masthead{flex-direction:column;align-items:flex-start;}
  .msub{text-align:left;}
  .overall{grid-template-columns:1fr 1fr;}
  .topics{grid-template-columns:1fr;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div><div class="mark">MMMUT · GORAKHPUR</div><h1 class="title">The Ledger</h1></div>
    <div class="msub">Syllabus tracker: open any course, then tick topics and units off as you cover them.</div>
  </header>

  <div class="controls">
    <div class="field"><label for="branchSel">Branch</label><select id="branchSel"></select></div>
    <div class="field"><label for="q">Search courses and topics</label><input class="q" id="q" type="search" placeholder="e.g. Hardy-Cross, beams, eigenvalues" autocomplete="off" /></div>
  </div>
  <p class="cover" id="cover"></p>
  <div class="strip" id="strip"></div>

  <div id="ledger"></div>
  <div class="subtotal" id="subtotal"><span class="label" id="subLabel"></span><span class="value" id="subValue"></span></div>
  <div class="bar"><i id="semBar" style="width:0%"></i></div>
  <div class="overall" id="overall"></div>
  <div class="foot">
    <span>Syllabus text from the Civil Engineering curriculum book (w.e.f. 2024-25). Progress is saved on this device only.</span>
    <button class="link" id="resetBtn">Reset this branch</button>
  </div>
</div>

oce and One Minor test and One Major Theory & Practical Examination","o":"The objectives of the course are as follows: 1. To develop an appreciation of soil as a vital construction material, so that it may subsequently be used in the design and construction of foundation for civil engineering structures. 2. To develop an understanding of the relationships between physical characteristics and mechanical properties of soils. 3. To inculcate the basic knowledge of classification and engineering properties of soil and its suitability as a foundation/subgrade material. 4. To understand the experimental methods for physical and mechanical soil properties","co":["After completion of this course the students to demonstrate following knowledge, skills and attitudes.","Fundamental differences in engineering behavior between cohesive and cohesionless soils.","Compute the groundwater seepage and distribution of ground water pressure.","Compute the applied stress beneath the ground surface.","Demonstrate the fundamental difference in the strength and deformation characteristics of cohesive and cohesionless soils.","Analyze field and laboratory data to determine the strength and deformation properties of cohesive and cohesionless soils.","Compute settlements due to consolidation of soil."],"u":[{"l":"I","t":"Geological Characteristics of Soils","h":null,"p":["Origin of soils and rocks","composition of soils: soil formation, types","clay minerals","and soil fabric","soil structure","coarse-grained and fine-grained soil for engineering use","Physical Soil Parameters: Basic three phase relationships","index properties of soil","dry unit weight-water content relationship","Atterberg’s limits","soil classification schemes"]},{"l":"II","t":"Soil Compaction","h":null,"p":["Laboratory compaction","Standard and Modified Proctor compaction tests","zero air void curve","factors affecting soil compaction","field compaction","compaction quality control: Proctor Needle Test","Purpose and Phase const IDS = Object.keys(DATA);
const KEY = 'ledger-syllabus-tracker-v2';
const OLD_KEY = 'ledger-syllabus-tracker-v1';
const ROMAN = ['I','II','III','IV','V','VI','VII','VIII'];

let S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { S = {}; }
try {
  if (!Object.keys(S).length) {
    const old = JSON.parse(localStorage.getItem(OLD_KEY) || '{}');
    Object.keys(old).forEach(k => { if (old[k]) S['f|' + k] = 1; });
  }
} catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

let bid = IDS[0], view = '1', query = '', resetArmed = false;
const open = new Set();

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="var(--on-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg>';

// ---- helpers over subjects ----
const B = () => DATA[bid];
const flagKey = (v, code) => 'f|' + bid + '|' + v + '|' + code;
const topicKey = (d, u, t) => 't|' + bid + '|' + d + '|' + u + '|' + t;

function topicCount(sub) {
  const d = sub.d && DETAIL[sub.d];
  return d ? d.u.reduce((n, u) => n + u.p.length, 0) : 0;
}
function topicsDone(sub) {
  const d = sub.d && DETAIL[sub.d];
  if (!d) return 0;
  let n = 0;
  d.u.forEach((u, ui) => u.p.forEach((_, ti) => { if (S[topicKey(sub.d, ui, ti)]) n++; }));
  return n;
}
function isDone(sub, v) {
  const tot = topicCount(sub);
  if (tot) return topicsDone(sub) === tot || !!S[flagKey(v, sub.code)];
  return !!S[flagKey(v, sub.code)];
}
function setSubject(sub, v, on) {
  const d = sub.d && DETAIL[sub.d];
  if (on) S[flagKey(v, sub.code)] = 1; else delete S[flagKey(v, sub.code)];
  if (d) d.u.forEach((u, ui) => u.p.forEach((_, ti) => {
    const k = topicKey(sub.d, ui, ti);
    if (on) S[k] = 1; else delete S[k];
  }));
}
function setUnit(sub, v, ui, on) {
  const d = DETAIL[sub.d];
  d.u[ui].p.forEach((_, ti) => { const k = topicKey(sub.d, ui, ti); if (on) S[k] = 1; else delete S[k]; });
  delete S[flagKey(v, sub.code)];
}
function unitDone(sub, ui) {
  const u = DETAIL[sub.d].u[ui];
  let n = 0;
  u.p.forEach((_, ti) => { if (S[topicKey(sub.d, ui, ti)]) n++; });
  return n;
}
function semSubjects(v) { return (B().semesters[v] || []); }
function allViews() {
  const list = Object.keys(B().semesters).map(String);
  (B().extras || []).forEach(x => list.push(x.id));
  return list;
}
function findSubject(v, code) {
  const sems = B().semesters[v];
  if (sems) return sems.find(s => s.code === code);
  const ex = (B().extras || []).find(x => x.id === v);
  if (ex) for (const g of ex.groups) { const f = g.subjects.find(s => s.code === code); if (f) return f; }
}

// ---- render ----
function renderSubject(sub, v, tag) {
  const sid = bid + '|' + v + '|' + sub.code;
  const d = sub.d && DETAIL[sub.d];
  const done = isDone(sub, v);
  const tot = topicCount(sub), td = tot ? topicsDone(sub) : 0;
  const isOpen = open.has(sid) && d;
  const part = !done && td > 0;
  let html = `<div class="subj ${done ? 'done' : ''} ${isOpen ? 'open' : ''}">
    <div class="row">
      <button class="cb ${done ? 'on' : ''} ${part ? 'part' : ''}" data-act="subj" data-v="${v}" data-c="${esc(sub.code)}" role="checkbox" aria-checked="${done}" aria-label="Mark ${esc(sub.name)} cleared">${CHECK}</button>
      <div class="scode col-code">${esc(sub.code)}</div>
      <button class="row-main" data-act="open" data-v="${v}" data-c="${esc(sub.code)}" ${d ? '' : 'tabindex="-1"'} aria-expanded="${!!isOpen}">
        <span class="sname">${esc(sub.name)}${tag ? `<span class="sem-tag">${esc(tag)}</span>` : ''}</span>
        ${tot ? `<span class="mini"><span class="bar"><i style="width:${Math.round(td / tot * 100)}%"></i></span><span>${td}/${tot} topics</span></span>`
              : `<span class="nod">Unit-wise syllabus not loaded</span>`}
      </button>
      <div class="sltp col-ltp">${esc(sub.ltp)}</div>
      <div class="scred">${sub.credits}</div>
      <div class="chev">${d ? '›' : ''}</div>
    </div>`;
  if (isOpen) html += renderPanel(sub, v, d);
  return html + '</div>';
}

function renderPanel(sub, v, d) {
  let h = '<div class="panel"><div class="meta">';
  const m = [['Category', d.c], ['Prerequisite', d.p], ['Contact hours per week', d.k], ['Credits', d.cr], ['Assessment', d.a]];
  m.forEach(([k, val]) => { if (val !== '' && val != null) h += `<div><i>${k}</i>${esc(val)}</div>`; });
  h += '</div>';
  if (d.o) h += `<div class="sec">Course objectives</div><p>${esc(d.o)}</p>`;
  if (d.co && d.co.length) h += `<div class="sec">Course outcomes</div><ol class="list">${d.co.map(c => `<li>${esc(c)}</li>`).join('')}</ol>`;
  h += '<div class="sec">Units and topics</div>';
  d.u.forEach((u, ui) => {
    const n = u.p.length, dn = unitDone(sub, ui);
    const on = n > 0 && dn === n;
    h += `<div class="unit"><div class="uh">
      <button class="cb ${on ? 'on' : ''} ${!on && dn ? 'part' : ''}" data-act="unit" data-v="${v}" data-c="${esc(sub.code)}" data-u="${ui}" role="checkbox" aria-checked="${on}" aria-label="Mark unit ${esc(u.l)} covered">${CHECK}</button>
      <span class="ul">Unit ${esc(u.l)}</span><span class="ut">${esc(u.t)}</span>
      <span class="uc">${u.h ? u.h + ' hrs · ' : ''}${dn}/${n}</span></div><div class="topics">`;
    u.p.forEach((t, ti) => {
      const tk = !!S[topicKey(sub.d, ui, ti)];
      h += `<div class="topic ${tk ? 'on' : ''}" data-act="topic" data-v="${v}" data-c="${esc(sub.code)}" data-u="${ui}" data-t="${ti}"><button class="cb ${tk ? 'on' : ''}" tabindex="-1" aria-hidden="true">${CHECK}</button><span>${esc(t)}</span></div>`;
    });
    h += '</div></div>';
  });
  if (d.b && d.b.length) h += `<div class="sec">Books and references</div><ol class="list">${d.b.map(b => `<li>${esc(b)}</li>`).join('')}</ol>`;
  return h + '</div>';
}

function matches(sub, q) {
  const hay = [sub.code, sub.name];
  const d = sub.d && DETAIL[sub.d];
  if (d) d.u.forEach(u => { hay.push(u.t); u.p.forEach(t => hay.push(t)); });
  return hay.join(' ').toLowerCase().includes(q);
}

function renderStrip() {
  const el = $('strip');
  let h = '';
  Object.keys(B().semesters).map(Number).sort((a, b) => a - b).forEach(s => {
    const t = semTotals(String(s));
    const done = t.total > 0 && t.done === t.total;
    h += `<button class="chip ${String(s) === view && !query ? 'active' : ''} ${done ? 'done' : ''}" data-v="${s}" aria-label="Semester ${s}">${ROMAN[s - 1] || s}</button>`;
  });
  if ((B().extras || []).length) h += '<span class="sep"></span>';
  (B().extras || []).forEach(x => { h += `<button class="chip txt ${x.id === view && !query ? 'active' : ''}" data-v="${x.id}">${x.label}</button>`; });
  el.innerHTML = h;
}

function semTotals(v) {
  let total = 0, done = 0;
  semSubjects(v).forEach(sub => { total += sub.credits; if (isDone(sub, v)) done += sub.credits; });
  return { total, done };
}

function renderLedger() {
  const el = $('ledger');
  let h = '';
  if (query) {
    let n = 0;
    allViews().forEach(v => {
      const subs = [];
      if (B().semesters[v]) B().semesters[v].forEach(s => subs.push(s));
      else (B().extras.find(x => x.id === v).groups).forEach(g => g.subjects.forEach(s => subs.push(s)));
      const label = B().semesters[v] ? 'Sem ' + (ROMAN[+v - 1] || v) : B().extras.find(x => x.id === v).label;
      subs.filter(s => matches(s, query)).forEach(s => { if (n < 60) h += renderSubject(s, v, label); n++; });
    });
    el.innerHTML = n ? `<div class="ledger">${h}</div>` + (n > 60 ? `<div class="empty">Showing 60 of ${n} matches. Narrow the search to see the rest.</div>` : '') : '<div class="empty">No course or topic matches that search.</div>';
    return;
  }
  const ex = (B().extras || []).find(x => x.id === view);
  if (ex) {
    ex.groups.forEach(g => {
      h += `<div class="gtitle">${esc(g.title)}</div><div class="ledger">${g.subjects.map(s => renderSubject(s, view)).join('')}</div>`;
    });
  } else {
    const subs = semSubjects(view);
    h = subs.length ? `<div class="ledger">${subs.map(s => renderSubject(s, view)).join('')}</div>` : '<div class="empty">No listed courses for this semester.</div>';
  }
  el.innerHTML = h;
}

function renderTotals() {
  const isEx = !!(B().extras || []).find(x => x.id === view);
  $('subtotal').style.display = (isEx || query) ? 'none' : 'flex';
  $('semBar').parentElement.style.display = (isEx || query) ? 'none' : 'block';
  if (!isEx && !query) {
    const t = semTotals(view);
    $('subLabel').textContent = 'Semester credits cleared';
    $('subValue').textContent = t.done + ' / ' + t.total;
    $('semBar').style.width = (t.total ? Math.round(t.done / t.total * 100) : 0) + '%';
  }
  let tc = 0, dc = 0, sc = 0, sems = 0, topics = 0, topicsD = 0;
  Object.keys(B().semesters).forEach(v => {
    const t = semTotals(v); tc += t.total; dc += t.done; sems++;
    if (t.total > 0 && t.done === t.total) sc++;
    semSubjects(v).forEach(s => { topics += topicCount(s); topicsD += topicsDone(s); });
  });
  (B().extras || []).forEach(x => x.groups.forEach(g => g.subjects.forEach(s => { topics += topicCount(s); topicsD += topicsDone(s); })));
  $('overall').innerHTML = `
    <div class="stat"><div class="n">${dc}/${tc}</div><div class="l">Credits cleared</div></div>
    <div class="stat"><div class="n">${tc ? Math.round(dc / tc * 100) : 0}%</div><div class="l">Programme completed</div></div>
    <div class="stat"><div class="n">${sc}/${sems}</div><div class="l">Semesters fully cleared</div></div>
    <div class="stat"><div class="n">${topicsD}/${topics}</div><div class="l">Topics covered${topics ? '' : ' (none loaded)'}</div></div>`;
}

function renderCover() {
  let withD = 0, all = 0;
  Object.values(B().semesters).forEach(a => a.forEach(s => { all++; if (s.d) withD++; }));
  const extra = (B().extras || []).reduce((n, x) => n + x.groups.reduce((m, g) => m + g.subjects.length, 0), 0);
  $('cover').innerHTML = withD
    ? `<b>${withD} of ${all}</b> core courses in this branch have a full unit-wise syllabus${extra ? `, plus <b>${extra}</b> electives, skill and audit courses` : ''}. Courses marked "not loaded" can still be ticked off as a whole.`
    : `Unit-wise syllabus isn't loaded for this branch yet, so each course is tracked as a whole. Add the branch's syllabus book to unlock unit and topic tracking.`;
}

function render() { renderCover(); renderStrip(); renderLedger(); renderTotals(); }

// ---- events ----
$('branchSel').innerHTML = IDS.map(id => `<option value="${id}">${esc(DATA[id].name)}</option>`).join('');
$('branchSel').addEventListener('change', e => { bid = e.target.value; view = '1'; query = ''; $('q').value = ''; open.clear(); resetArmed = false; $('resetBtn').textContent = 'Reset this branch'; render(); });
$('q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });
$('strip').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  view = b.dataset.v; query = ''; $('q').value = ''; render();
});
$('ledger').addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const v = t.dataset.v, sub = findSubject(v, t.dataset.c); if (!sub) return;
  const act = t.dataset.act;
  if (act === 'open') { if (!sub.d) return; const sid = bid + '|' + v + '|' + sub.code; open.has(sid) ? open.delete(sid) : open.add(sid); }
  else if (act === 'subj') setSubject(sub, v, !isDone(sub, v));
  else if (act === 'unit') { const ui = +t.dataset.u; const n = DETAIL[sub.d].u[ui].p.length; setUnit(sub, v, ui, unitDone(sub, ui) !== n); }
  else if (act === 'topic') {
    const k = topicKey(sub.d, +t.dataset.u, +t.dataset.t);
    if (S[k]) delete S[k]; else S[k] = 1;
    delete S[flagKey(v, sub.code)];
  }
  if (act !== 'open') save();
  render();
});
$('resetBtn').addEventListener('click', () => {
  if (!resetArmed) { resetArmed = true; $('resetBtn').textContent = 'Click again to erase progress for ' + B().name; return; }
  const pre = new RegExp('^[ft]\\|' + bid + '\\|');
  Object.keys(S).forEach(k => { if (pre.test(k)) delete S[k]; });
  save(); resetArmed = false; $('resetBtn').textContent = 'Reset this branch'; render();
});
render();
</script>
</body>
</html>
